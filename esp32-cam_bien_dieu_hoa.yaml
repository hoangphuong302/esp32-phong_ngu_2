substitutions:
  board_type: "esp32-c3-devkitm-1"

esphome:
  name: cam-bien-dh-ngu2
  friendly_name: "Cảm biến điều hòa phòng ngủ 2"
  platformio_options:
    board_build.f_cpu: 80000000L
  on_boot:
    priority: -10
    then:
      - script.execute: led_indicator_loop
      - script.execute: push_sensors_to_ha

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# 🔇 Logger set to INFO to troubleshoot connection/HTTP push status
logger:
  level: INFO
  baud_rate: 0

ble_client:
  - mac_address: FF:FF:DE:0D:04:AF
    id: led_strip
    auto_connect: false
    on_connect:
      then:
        - lambda: |-
            id(g_ble_connected) = true;
            ESP_LOGI("ble", "BLE LED strip CONNECTED!");
        - delay: 1s
        - lambda: |-
            ESP_LOGI("ble", "Sending test ON command after connect...");
        - ble_client.ble_write:
            id: led_strip
            service_uuid: 'FFE5'
            characteristic_uuid: 'FFE9'
            value: [0xCC, 0x23, 0x33]
        - delay: 500ms
        - lambda: |-
            ESP_LOGI("ble", "Sending test RED color after connect...");
        - ble_client.ble_write:
            id: led_strip
            service_uuid: 'FFE5'
            characteristic_uuid: 'FFE9'
            value: [0x56, 0xFF, 0x00, 0x00, 0x00, 0xF0, 0xAA]
    on_disconnect:
      then:
        - lambda: |-
            id(g_ble_connected) = false;
            ESP_LOGW("ble", "BLE LED strip DISCONNECTED!");

# 📡 ESPHome API — CHỈ giữ để OTA flash, reboot_timeout=0 vì không dùng native API
api:
  reboot_timeout: 0s
  services:
    - service: transmit_raw
      variables:
        command: int[]
      then:
        - script.execute: blink_led
        - remote_transmitter.transmit_raw:
                      code: !lambda "return command;"

# ✅ HTTP client — ESP32 chủ động PUSH lên nhasam.id.vn
http_request:
  useragent: "esphome/cam-bien-pn2"
  timeout: 3s
  verify_ssl: false

# ══════════════════════════════════════════════════════════════
# 🧠 GLOBALS: State machine nội bộ cho GPIO1 — không cần WiFi
# ══════════════════════════════════════════════════════════════
globals:
  - id: g_ble_connected
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_fast_sensor_push
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_fast_push_start_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_history_json
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_http_active
    type: bool
    restore_value: false
    initial_value: 'false'
  # Đếm số lần liên tiếp đọc LED = đang chạy
  - id: g_on_count
    type: int
    restore_value: false
    initial_value: '0'

  # Đếm số lần liên tiếp đọc LED = đã tắt
  - id: g_off_count
    type: int
    restore_value: false
    initial_value: '0'

  # Trạng thái đã xác nhận — lưu vào flash để không mất khi khởi động lại
  # 0 = tắt, 1 = đang chạy
  - id: g_ac_state
    type: int
    restore_value: true
    initial_value: '0'

  # Nhiệt độ baseline = nhiệt độ miệng gió khi AC TẮT (= nhiệt độ phòng)
  # Tự động cập nhật mỗi khi state machine xác nhận AC đã tắt
  # So sánh: outlet_temp < baseline - 4°C → AC đang làm lạnh thật
  - id: g_baseline_temp
    type: float
    restore_value: true
    initial_value: '30.0'

  # Cờ lưu trạng thái đẩy dữ liệu thành công
  - id: g_push_ok
    type: bool
    restore_value: false
    initial_value: 'false'

  # Cảm biến Xiaomi BLE
  - id: g_xiaomi_temp
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_xiaomi_humid
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_xiaomi_changed
    type: bool
    restore_value: false
    initial_value: 'false'

# ══════════════════════════════════════════════════════════════
# 📦 SCRIPTS: Push sự kiện lên nhasam.id.vn
# ══════════════════════════════════════════════════════════════
script:
  - id: trigger_fast_sensor_push
    then:
      - lambda: |-
          ESP_LOGI("sensor", "Triggering fast sensor push mode (5s interval for 2m)...");
          id(g_fast_sensor_push) = true;
          id(g_fast_push_start_time) = millis();
          if (wifi::global_wifi_component->is_connected() && !id(g_http_active)) {
            id(push_sensors_to_ha).execute();
          }

  - id: write_ble_command
    mode: queued
    parameters:
      cmd: std::vector<uint8_t>
    then:
      - lambda: |-
          // Log the bytes being sent
          std::string hex;
          for (auto b : cmd) {
            char buf[4];
            snprintf(buf, sizeof(buf), "%02X ", b);
            hex += buf;
          }
          ESP_LOGI("ble", "BLE TX (%d bytes): %s", cmd.size(), hex.c_str());
      - ble_client.ble_write:
          id: led_strip
          service_uuid: 'FFE5'
          characteristic_uuid: 'FFE9'
          value: !lambda |-
            return cmd;

  - id: parse_ir_response
    parameters:
      body: string
    then:
      - lambda: |-
          if (!body.empty()) {
            JsonDocument doc;
            DeserializationError error = deserializeJson(doc, body);
            if (!error) {
              if (doc["ir_commands"].is<JsonArray>()) {
                JsonArray ir_cmds = doc["ir_commands"];
                bool has_ir = false;
                for (JsonArray cmd : ir_cmds) {
                  std::vector<int32_t> pulses;
                  for (int32_t pulse : cmd) {
                    pulses.push_back(pulse);
                  }
                  if (!pulses.empty()) {
                    ESP_LOGI("ir", "Transmitting pending IR command from queue, count: %d", pulses.size());
                    id(blink_led).execute();
                    auto call = id(main_transmitter).transmit();
                    call.get_data()->set_carrier_frequency(38000);
                    call.get_data()->set_data(pulses);
                    call.perform();
                    has_ir = true;
                  }
                }
                if (has_ir) {
                  id(trigger_fast_sensor_push).execute();
                }
              }
              if (doc["ble_commands"].is<JsonArray>()) {
                JsonArray ble_cmds = doc["ble_commands"];
                for (JsonArray cmd : ble_cmds) {
                  std::vector<uint8_t> bytes;
                  for (uint8_t b : cmd) {
                    bytes.push_back(b);
                  }
                  if (!bytes.empty()) {
                    ESP_LOGI("ble", "Sending pending BLE command from queue, size: %d", bytes.size());
                    id(write_ble_command).execute(bytes);
                  }
                }
              }
              if (doc.containsKey("ble_connect")) {
                bool should_connect = doc["ble_connect"];
                if (should_connect) {
                  if (!id(g_ble_connected)) {
                    ESP_LOGI("ble", "Server requested BLE connect, connecting...");
                    id(led_strip)->connect();
                  }
                } else {
                  if (id(g_ble_connected)) {
                    ESP_LOGI("ble", "Server requested BLE disconnect, disconnecting...");
                    id(led_strip)->disconnect();
                  }
                }
              }
            }
          }

  - id: led_indicator_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - if:
                condition:
                  lambda: |-
                    return id(g_push_ok) && wifi::global_wifi_component->is_connected();
                then:
                  # Normal connected & pushing fine: 0.2s ON, 2s OFF
                  - switch.turn_on: led_8
                  - switch.turn_on: led_10
                  - delay: 200ms
                  - switch.turn_off: led_8
                  - switch.turn_off: led_10
                  - delay: 2000ms
                else:
                  # Error / disconnected / not pushing: 0.3s ON, 0.3s OFF
                  - switch.turn_on: led_8
                  - switch.turn_on: led_10
                  - delay: 300ms
                  - switch.turn_off: led_8
                  - switch.turn_off: led_10
                  - delay: 300ms

  - id: blink_led
    then:
      - script.stop: led_indicator_loop
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - delay: 50ms
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - delay: 50ms
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - script.execute: led_indicator_loop

  # ⚡ Sự kiện: Điều hòa vừa BẬT — payload gọn, chỉ gửi khi đảo trạng thái
  - id: push_ac_on
    then:
      - lambda: "id(g_http_active) = true;"
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return std::string(
              "{\"device_key\":\"cam-bien-pn2\","
              "\"ac_state\":\"on\"}"
            );
          on_response:
            then:
              - lambda: "id(g_http_active) = false;"
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[AC ON Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: "id(g_http_active) = false;"
              - lambda: |-
                  id(g_push_ok) = false;

  # ⚡ Sự kiện: Điều hòa vừa TẮT
  - id: push_ac_off
    then:
      - lambda: "id(g_http_active) = true;"
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return std::string(
              "{\"device_key\":\"cam-bien-pn2\","
              "\"ac_state\":\"off\"}"
            );
          on_response:
            then:
              - lambda: "id(g_http_active) = false;"
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[AC OFF Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: "id(g_http_active) = false;"
              - lambda: |-
                  id(g_push_ok) = false;

  # 🌡️ Push điện áp định kỳ kèm lịch sử
  - id: push_sensors_to_ha
    then:
      - lambda: "id(g_http_active) = true;"
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char volt[32], rssi[32], uptime_s[32], temp[32], humid[32], cpu_s[32], local_t[32];
            if (std::isnan(id(led_mean).state)) strcpy(volt, "null");
            else snprintf(volt, sizeof(volt), "%.3f", id(led_mean).state);

            if (std::isnan(id(cb_wifi_rssi).state)) strcpy(rssi, "null");
            else snprintf(rssi, sizeof(rssi), "%.1f", id(cb_wifi_rssi).state);

            if (std::isnan(id(cb_uptime).state)) strcpy(uptime_s, "null");
            else snprintf(uptime_s, sizeof(uptime_s), "%.0f", id(cb_uptime).state);

            if (std::isnan(id(g_xiaomi_temp))) strcpy(temp, "null");
            else snprintf(temp, sizeof(temp), "%.1f", id(g_xiaomi_temp));

            if (std::isnan(id(g_xiaomi_humid))) strcpy(humid, "null");
            else snprintf(humid, sizeof(humid), "%.1f", id(g_xiaomi_humid));

            if (std::isnan(id(cpu_temp).state)) strcpy(cpu_s, "null");
            else snprintf(cpu_s, sizeof(cpu_s), "%.1f", id(cpu_temp).state);

            if (std::isnan(id(cb_temp).state)) strcpy(local_t, "null");
            else snprintf(local_t, sizeof(local_t), "%.2f", id(cb_temp).state);

            std::string sensors_json = 
              "\"sensor.cam_bien_dh_ngu_2_nhiet_do\":{\"state\":" + std::string(local_t) + ",\"unit\":\"\\u00b0C\",\"class\":\"temperature\",\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 ph\\u00f2ng ng\\u1ee7 2\"},"
              "\"sensor.cam_bien_dh_ngu_2_dien_ap\":{\"state\":" + std::string(volt) + ",\"unit\":\"V\",\"class\":\"voltage\",\"name\":\"\\u0110i\\u1ec7n \\u00e1p LED\"},"
              "\"sensor.cam_bien_dh_ngu_2_wifi_rssi\":{\"state\":" + std::string(rssi) + ",\"unit\":\"dBm\",\"class\":\"signal_strength\",\"name\":\"WiFi RSSI\"},"
              "\"sensor.cam_bien_dh_ngu_2_uptime\":{\"state\":" + std::string(uptime_s) + ",\"unit\":\"s\",\"class\":\"duration\",\"name\":\"Uptime\"},"
              "\"sensor.miaomiaoce_t2_aaaf_temperature\":{\"state\":" + std::string(temp) + ",\"unit\":\"\\u00b0C\",\"class\":\"temperature\",\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 Ban C\\u00f4ng\"},"
              "\"sensor.miaomiaoce_t2_aaaf_humidity\":{\"state\":" + std::string(humid) + ",\"unit\":\"%%\","
              "\"class\":\"humidity\","
              "\"name\":\"\\u0110\\u1ed9 \\u1ea3m Ban C\\u00f4ng\"},"
              "\"sensor.cam_bien_dh_ngu_2_nhiet_do_cpu\":{\"state\":" + std::string(cpu_s) + ",\"unit\":\"\\u00b0C\",\"class\":\"temperature\",\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 CPU\"}";

            std::string hist = id(g_history_json);
            if (!hist.empty() && hist.back() == ',') {
              hist.pop_back();
            }

            uint32_t current_uptime = millis() / 1000;
            std::string payload = "{\"device_key\":\"cam-bien-pn2\",\"current_uptime\":" + std::to_string(current_uptime) + ",\"sensors\":{" + sensors_json + "},\"history\":[" + hist + "]}";
            return payload;
          on_response:
            then:
              - lambda: "id(g_http_active) = false;"
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                        id(g_history_json) = "";
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[Sensor Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: "id(g_http_active) = false;"
              - lambda: |-
                  id(g_push_ok) = false;

switch:
  - platform: gpio
    pin: GPIO8
    id: led_8
    inverted: true
  - platform: gpio
    pin: GPIO10
    id: led_10
    inverted: true

ota:
  platform: esphome

wifi:
  networks:
    - ssid: "3324 2.4ghz"
      password: "L@345678"
      priority: 15
    - ssid: "3324_2.4ghz"
      password: "L@345678"
      priority: 10
    - ssid: "Phuongbk_2.4Ghz"
      password: "L@345678"
      priority: 5
    - ssid: "phuongbk 2.4ghz"
      password: "L@345678"
      priority: 5
    - ssid: "mcbooks"
      password: "mcbooks123"
      priority: 0
    - ssid: "MCBOOKS"
      password: "mcbooks123"
      priority: 0
    - ssid: "mcbook"
      password: "mcbooks123"
      priority: 0
    - ssid: "MCBOOK"
      password: "mcbooks123"
      priority: 0

  # 🔋 LIGHT: enable power saving to run cool
  power_save_mode: LIGHT

  # 📶 15dB to test stability and reduce heat
  output_power: 15dB

  # Kết nối nhanh, không scan lại từ đầu khi đổi IP hoặc mất điện cắm lại
  fast_connect: true

  # 🔁 Không tự reboot khi không có ai kết nối vào AP fallback
  # ESP32 cứ chạy nội bộ, chờ WiFi xuất hiện trở lại
  reboot_timeout: 0s

  # 📶 AP fallback — chỉ bật khi không tìm được WiFi sau 30s
  ap:
    ssid: "esp32 dieu hoa ngu 2"

  on_connect:
    then:
      - if:
          condition:
            lambda: "return id(g_ac_state) == 1;"
          then:
            - script.execute: push_ac_on
          else:
            - script.execute: push_ac_off
      - script.execute: push_sensors_to_ha

captive_portal:

# 🌡️ Dallas 1-Wire Temperature Sensor (DS18B20) on GPIO3
one_wire:
  - platform: gpio
    pin: GPIO3
    id: dallas_hub

# 📶 Bluetooth Tracker (Passive Mode to run cool)
esp32_ble_tracker:
  scan_parameters:
    interval: 400ms
    window: 80ms
    active: false

sensor:
  - platform: dallas_temp
    one_wire_id: dallas_hub
    name: "Nhiệt độ phòng ngủ 2"
    id: cb_temp
    update_interval: 10s
  - platform: ble_rssi
    mac_address: FF:FF:DE:0D:04:AF
    name: "LED Strip RSSI"
    id: led_strip_rssi
  - platform: xiaomi_lywsd03mmc
    mac_address: "A4:C1:38:50:AA:AF"
    bindkey: "e0b40d6a649749b3116cd9326f00a2b5"
    temperature:
      id: xiaomi_temp
      name: "Xiaomi Temperature"
      on_value:
        - lambda: |-
            id(g_xiaomi_temp) = x;
            id(g_xiaomi_changed) = true;
    humidity:
      id: xiaomi_humid
      name: "Xiaomi Humidity"
      on_value:
        - lambda: |-
            id(g_xiaomi_humid) = x;
            id(g_xiaomi_changed) = true;

  # ── GPIO1 diagnostics: mean và std dev — cập nhật từ interval lambda ──
  # update_interval: never → chỉ publish khi interval lambda gọi publish_state()
  - platform: template
    name: "LED AC Mean"
    id: led_mean
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    name: "LED AC StdDev"
    id: led_stddev
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  # ── Diagnostics ──
  - platform: uptime
    name: "Uptime"
    id: cb_uptime
    update_interval: 30s

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: cb_wifi_rssi
    update_interval: 30s

  - platform: internal_temperature
    name: "Nhiệt độ CPU"
    id: cpu_temp
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# ══════════════════════════════════════════════════════════════
# ⚙️ INTERVALS: Tách riêng scan GPIO1 và push sensor
# ══════════════════════════════════════════════════════════════
interval:

  # ── 1. Quét GPIO1 mỗi 5 giây — thuần nội bộ, KHÔNG WiFi ──
  # Quét nhanh để phát hiện đảo trạng thái sớm nhất có thể
  # Spike dòng: ~2mA × 60ms = không đáng kể, tụ 2200µF gánh hết
  - interval: 1500ms
    then:
      - lambda: |-
          // Safety timeout for HTTP active flag (fail-safe)
          static uint32_t active_since = 0;
          if (id(g_http_active)) {
            if (active_since == 0) {
              active_since = millis();
              if (active_since == 0) active_since = 1;
            } else if (millis() - active_since > 8000) {
              ESP_LOGW("http", "HTTP request stuck for >8s, forcing active flag reset!");
              id(g_http_active) = false;
              active_since = 0;
            }
          } else {
            active_since = 0;
          }

          // ════════════════════════════════════════════════════
          // NGUỒN 1 — GPIO1 (PRIMARY, nhanh, phản hồi tức thì)
          // ════════════════════════════════════════════════════
          // Đọc 3 sample trong 60ms — delay() = vTaskDelay() trên ESP32
          // → yield cho FreeRTOS, WiFi stack vẫn chạy bình thường
          const int N = 3;
          float s[N], sum = 0.0f, sq = 0.0f;
          for (int i = 0; i < N; i++) {
            s[i] = analogReadMilliVolts(1) / 1000.0f;
            sum += s[i];
            if (i < N - 1) delay(30);
          }
          float mean = sum / (float)N;
          for (int i = 0; i < N; i++) sq += (s[i] - mean) * (s[i] - mean);
          float std_dev = sqrtf(sq / (float)N);

          id(led_mean).publish_state(mean);
          id(led_stddev).publish_state(std_dev);

          // Phòng ngủ 2: ổn định >1v thì là tắt, biến động hoặc <1v là đang bật
          bool gpio_on  = (mean < 1.0f || std_dev >= 0.08f);
          bool gpio_off = (mean >= 1.0f && std_dev < 0.08f);

          // ════════════════════════════════════════════════════
          // CẬP NHẬT COUNTER
          // ════════════════════════════════════════════════════
          if (gpio_on) {
            id(g_on_count)++;
            id(g_off_count) = 0;
          } else if (gpio_off) {
            id(g_off_count)++;
            id(g_on_count) = 0;
          }
          // AMBIGUOUS: không đổi counter — chờ thêm mẫu rõ hơn

          // ════════════════════════════════════════════════════
          // NGƯỠNG XÁC NHẬN — Chỉ dựa trên GPIO1
          // ════════════════════════════════════════════════════
          int on_threshold = 2;   // 10s nhấp nhô
          int off_threshold = 3;  // 15s ổn định

          // ════════════════════════════════════════════════════
          // KẾT LUẬN + PUSH (chỉ khi đảo trạng thái)
          // ════════════════════════════════════════════════════
          // Đã vô hiệu hóa phát hiện tự động từ GPIO1 do nhiễu trồi sụt điện áp.
          // Chỉ điều khiển và cập nhật trạng thái khi nhận được lệnh từ Web UI.

  # ── 2. Poll lệnh IR pending mỗi 1000ms ──
  - interval: 1000ms
    then:
      - if:
          condition:
            lambda: "return wifi::global_wifi_component->is_connected() && !id(g_http_active);"
          then:
            - lambda: "id(g_http_active) = true;"
            - http_request.post:
                url: "http://nhasam.id.vn/aura-api/esp-push"
                capture_response: true
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  char volt[32];
                  if (std::isnan(id(led_mean).state)) strcpy(volt, "null");
                  else snprintf(volt, sizeof(volt), "%.3f", id(led_mean).state);

                  char rssi_str[32];
                  float rssi_val = id(led_strip_rssi).state;
                  if (std::isnan(rssi_val)) strcpy(rssi_str, "null");
                  else snprintf(rssi_str, sizeof(rssi_str), "%d", (int)rssi_val);

                  char buf[1024];
                  if (id(g_xiaomi_changed)) {
                    id(g_xiaomi_changed) = false; // Reset flag
                    
                    char temp[32], humid[32];
                    if (std::isnan(id(g_xiaomi_temp))) strcpy(temp, "null");
                    else snprintf(temp, sizeof(temp), "%.1f", id(g_xiaomi_temp));

                    if (std::isnan(id(g_xiaomi_humid))) strcpy(humid, "null");
                    else snprintf(humid, sizeof(humid), "%.1f", id(g_xiaomi_humid));

                    snprintf(buf, sizeof(buf),
                      "{\"device_key\":\"cam-bien-pn2\",\"poll_only\":true,\"voltage\":%s,\"ble_connected\":%s,\"led_rssi\":%s,"
                      "\"sensors\":{"
                      "\"sensor.miaomiaoce_t2_aaaf_temperature\":"
                        "{\"state\":%s,\"unit\":\"\\u00b0C\","
                        "\"class\":\"temperature\","
                        "\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 Ban C\\u00f4ng\"},"
                      "\"sensor.miaomiaoce_t2_aaaf_humidity\":"
                        "{\"state\":%s,\"unit\":\"%%\","
                        "\"class\":\"humidity\","
                        "\"name\":\"\\u0110\\u1ed9 \\u1ea3m Ban C\\u00f4ng\"}"
                      "}}",
                      volt, id(g_ble_connected) ? "true" : "false", rssi_str, temp, humid
                    );
                  } else {
                    snprintf(buf, sizeof(buf), "{\"device_key\":\"cam-bien-pn2\",\"poll_only\":true,\"voltage\":%s,\"ble_connected\":%s,\"led_rssi\":%s}", volt, id(g_ble_connected) ? "true" : "false", rssi_str);
                  }
                  return std::string(buf);
                on_response:
                  then:
                    - lambda: "id(g_http_active) = false;"
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: parse_ir_response
                              body: !lambda return body;
                on_error:
                  then:
                    - lambda: "id(g_http_active) = false;"

  # ── 3. Thu thập dữ liệu cảm biến mỗi 10 giây vào bộ nhớ đệm ──
  - interval: 10s
    then:
      - lambda: |-
          float temp = id(g_xiaomi_temp);
          float hum = id(g_xiaomi_humid);
          float local_temp = id(cb_temp).state;
          float volt = id(led_mean).state;
          float cpu = id(cpu_temp).state;
          uint32_t uptime = millis() / 1000;

          char t_str[16], h_str[16], local_t_str[16], v_str[16], cpu_str[16];
          if (std::isnan(temp)) strcpy(t_str, "null"); else snprintf(t_str, sizeof(t_str), "%.1f", temp);
          if (std::isnan(hum)) strcpy(h_str, "null"); else snprintf(h_str, sizeof(h_str), "%.1f", hum);
          if (std::isnan(local_temp)) strcpy(local_t_str, "null"); else snprintf(local_t_str, sizeof(local_t_str), "%.2f", local_temp);
          if (std::isnan(volt)) strcpy(v_str, "null"); else snprintf(v_str, sizeof(v_str), "%.3f", volt);
          if (std::isnan(cpu)) strcpy(cpu_str, "null"); else snprintf(cpu_str, sizeof(cpu_str), "%.1f", cpu);

          char entry[256];
          snprintf(entry, sizeof(entry),
            "{\"uptime\":%u,\"temp\":%s,\"humidity\":%s,\"local_temp\":%s,\"voltage\":%s,\"cpu_temp\":%s},",
            uptime, t_str, h_str, local_t_str, v_str, cpu_str
          );
          
          if (id(g_history_json).length() < 12000) {
            id(g_history_json) += entry;
          }

  # ── 4. Bộ điều phối đẩy dữ liệu cảm biến thông minh (Tự động 5s khi có thay đổi, bình thường 120s) ──
  - interval: 5s
    then:
      - lambda: |-
          static uint32_t last_push = 0;
          uint32_t now = millis();
          bool need_push = false;

          if (id(g_fast_sensor_push)) {
            // Chế độ đẩy nhanh: mỗi 5 giây
            if (now - last_push >= 4500) {
              need_push = true;
            }
            // Tự động tắt sau 2 phút (120000ms)
            if (now - id(g_fast_push_start_time) >= 120000) {
              ESP_LOGI("sensor", "Fast push mode timed out. Returning to normal mode (120s).");
              id(g_fast_sensor_push) = false;
            }
          } else {
            // Chế độ bình thường: mỗi 120 giây
            if (last_push == 0 || now - last_push >= 115000) {
              need_push = true;
            }
          }

          if (need_push && wifi::global_wifi_component->is_connected() && !id(g_http_active)) {
            last_push = now;
            id(push_sensors_to_ha).execute();
          }

remote_transmitter:
  id: main_transmitter
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true