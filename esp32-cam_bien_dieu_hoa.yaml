substitutions:
  board_type: "esp32-c3-devkitm-1"

esphome:
  name: cam-bien-dh-ngu2
  friendly_name: "Cảm biến điều hòa phòng ngủ 2"
  platformio_options:
    board_build.f_cpu: 80000000L
  on_boot:
    priority: -10
    then:
      - script.execute: led_indicator_loop
      - lambda: |-

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# 🔇 Logger set to DEBUG with filters to prevent verbosity
logger:
  level: DEBUG
  baud_rate: 0
  logs:
    sensor: INFO
    adc: INFO
    i2c: INFO
    wifi: INFO
    http_request: INFO

# 📡 ESPHome API — CHỈ giữ để OTA flash, reboot_timeout=0 vì không dùng native API
api:
  reboot_timeout: 0s
  services:
    - service: transmit_raw
      variables:
        command: int[]
      then:
        - script.execute: blink_led
        - remote_transmitter.transmit_raw:
            carrier_frequency: 38kHz
            code: !lambda "return command;"

# ✅ HTTP client — ESP32 chủ động PUSH lên nhasam.id.vn
http_request:
  useragent: "esphome/cam-bien-pn2"
  timeout: 3s
  verify_ssl: false

# ══════════════════════════════════════════════════════════════
# 🧠 GLOBALS: State machine nội bộ cho GPIO1 — không cần WiFi
# ══════════════════════════════════════════════════════════════
globals:
  # Đếm số lần liên tiếp đọc LED = đang chạy
  - id: g_on_count
    type: int
    restore_value: false
    initial_value: '0'

  # Đếm số lần liên tiếp đọc LED = đã tắt
  - id: g_off_count
    type: int
    restore_value: false
    initial_value: '0'

  # Trạng thái đã xác nhận — lưu vào flash để không mất khi khởi động lại
  # 0 = tắt, 1 = đang chạy
  - id: g_ac_state
    type: int
    restore_value: true
    initial_value: '0'

  # Nhiệt độ baseline = nhiệt độ miệng gió khi AC TẮT (= nhiệt độ phòng)
  # Tự động cập nhật mỗi khi state machine xác nhận AC đã tắt
  # So sánh: outlet_temp < baseline - 4°C → AC đang làm lạnh thật
  - id: g_baseline_temp
    type: float
    restore_value: true
    initial_value: '30.0'

  # Cờ lưu trạng thái đẩy dữ liệu thành công
  - id: g_push_ok
    type: bool
    restore_value: false
    initial_value: 'false'

  # Cờ đẩy sensor nhanh khi có lệnh IR từ web
  - id: g_fast_sensor_push
    type: bool
    restore_value: false
    initial_value: 'false'

  # Thời điểm bắt đầu fast push
  - id: g_fast_push_start_time
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Cờ kết nối BLE của LED chuột
  # Cờ đang kết nối BLE
  # Thời điểm hoạt động BLE cuối cùng
# ══════════════════════════════════════════════════════════════
# 📦 SCRIPTS: Push sự kiện lên nhasam.id.vn
# ══════════════════════════════════════════════════════════════
script:
  - id: parse_ir_response
    parameters:
      body: string
    then:
      - lambda: |-
          if (!body.empty()) {
            DynamicJsonDocument doc(16384);
            DeserializationError error = deserializeJson(doc, body);
            if (!error) {
              if (doc.containsKey("ir_commands")) {
                JsonArray ir_cmds = doc["ir_commands"];
                for (JsonArray cmd : ir_cmds) {
                  std::vector<int32_t> pulses;
                  for (int32_t pulse : cmd) {
                    pulses.push_back(pulse);
                  }
                  if (!pulses.empty()) {
                    ESP_LOGI("ir", "Transmitting pending IR command from queue, count: %d", pulses.size());
                    id(blink_led).execute();
                    
                    // --- IR Transmission (GPIO4, does NOT use radio) ---
                    auto call = id(main_transmitter).transmit();
                    call.get_data()->set_carrier_frequency(38000);
                    call.get_data()->set_data(pulses);
                    call.perform();
                    
                    // 350ms delay between IR commands — AC needs time to process
                    delay(350);
                    
                    // Kích hoạt fast push 5s trong 2 phút
                    id(g_fast_sensor_push) = true;
                    id(g_fast_push_start_time) = millis();
                  }
                }
              }
            }
          }

  - id: restore_wifi
    then:
      - wifi.enable:

  - id: led_indicator_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - if:
                condition:
                  lambda: |-
                    return id(g_push_ok) && wifi::global_wifi_component->is_connected();
                then:
                  # Normal connected & pushing fine: 0.2s ON, 2s OFF
                  - switch.turn_on: led_8
                  - switch.turn_on: led_10
                  - delay: 200ms
                  - switch.turn_off: led_8
                  - switch.turn_off: led_10
                  - delay: 2000ms
                else:
                  # Error / disconnected / not pushing: 0.3s ON, 0.3s OFF
                  - switch.turn_on: led_8
                  - switch.turn_on: led_10
                  - delay: 300ms
                  - switch.turn_off: led_8
                  - switch.turn_off: led_10
                  - delay: 300ms

  - id: blink_led
    then:
      - script.stop: led_indicator_loop
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - delay: 50ms
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - delay: 50ms
      - switch.turn_on: led_8
      - switch.turn_on: led_10
      - delay: 50ms
      - switch.turn_off: led_8
      - switch.turn_off: led_10
      - script.execute: led_indicator_loop

  # ⚡ Sự kiện: Điều hòa vừa BẬT — payload gọn, chỉ gửi khi đảo trạng thái
  - id: push_ac_on
    then:
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return std::string(
              "{\"device_key\":\"cam-bien-pn2\","
              "\"ac_state\":\"on\"}"
            );
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[AC ON Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: |-
                  id(g_push_ok) = false;

  # ⚡ Sự kiện: Điều hòa vừa TẮT
  - id: push_ac_off
    then:
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return std::string(
              "{\"device_key\":\"cam-bien-pn2\","
              "\"ac_state\":\"off\"}"
            );
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[AC OFF Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: |-
                  id(g_push_ok) = false;

  # 🌡️ Push nhiệt/ẩm/áp định kỳ — 5 phút/lần
  # Bao gồm: nhiệt độ phòng (BMP280) + nhiệt độ miệng gió (AHT20) + độ ẩm + áp suất
  - id: push_sensors_to_ha
    then:
      - http_request.post:
          url: "http://nhasam.id.vn/aura-api/esp-push"
          capture_response: true
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char t_room[32], volt[32], cpu_s[32], wifi_s[32];
            char xiaomi_t[32], xiaomi_h[32], xiaomi_b[32];
            if (std::isnan(id(cb_temp).state)) strcpy(t_room, "null");
            else snprintf(t_room, sizeof(t_room), "%.2f", id(cb_temp).state);

            if (std::isnan(id(led_mean).state)) strcpy(volt, "null");
            else snprintf(volt, sizeof(volt), "%.3f", id(led_mean).state);

            if (std::isnan(id(xiaomi_temp).state)) strcpy(xiaomi_t, "null");
            else snprintf(xiaomi_t, sizeof(xiaomi_t), "%.2f", id(xiaomi_temp).state);

            if (std::isnan(id(xiaomi_humi).state)) strcpy(xiaomi_h, "null");
            else snprintf(xiaomi_h, sizeof(xiaomi_h), "%.1f", id(xiaomi_humi).state);

            if (std::isnan(id(xiaomi_bat).state)) strcpy(xiaomi_b, "null");
            else snprintf(xiaomi_b, sizeof(xiaomi_b), "%.1f", id(xiaomi_bat).state);

            if (std::isnan(id(cpu_temp).state)) strcpy(cpu_s, "null");
            else snprintf(cpu_s, sizeof(cpu_s), "%.1f", id(cpu_temp).state);

            if (std::isnan(id(wifi_rssi).state)) strcpy(wifi_s, "null");
            else snprintf(wifi_s, sizeof(wifi_s), "%.0f", id(wifi_rssi).state);

            char buf[1408];
            snprintf(buf, sizeof(buf),
              "{\"device_key\":\"cam-bien-pn2\","
              "\"sensors\":{"
              "\"sensor.cam_bien_dh_ngu_2_nhiet_do\":"
                "{\"state\":%s,\"unit\":\"\\u00b0C\","
                "\"class\":\"temperature\","
                "\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 ph\\u00f2ng ng\\u1ee7 2\"},"
              "\"sensor.cam_bien_dh_ngu_2_dien_ap\":"
                "{\"state\":%s,\"unit\":\"V\","
                "\"class\":\"voltage\","
                "\"name\":\"\\u0110i\\u1ec7n \\u00e1p LED\"},"
              "\"sensor.miaomiaoce_t2_aaaf_temperature\":"
                "{\"state\":%s,\"unit\":\"\\u00b0C\","
                "\"class\":\"temperature\","
                "\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 Sam\"},"
              "\"sensor.miaomiaoce_t2_aaaf_humidity\":"
                "{\"state\":%s,\"unit\":\"%%\","
                "\"class\":\"humidity\","
                "\"name\":\"\\u0110\\u1ed9 \\u1ea9m Sam\"},"
              "\"sensor.miaomiaoce_t2_aaaf_battery\":"
                "{\"state\":%s,\"unit\":\"%%\","
                "\"class\":\"battery\","
                "\"name\":\"Pin C\\u1ea3m Bi\\u1ebfn Sam\"},"
              "\"sensor.cam_bien_dh_ngu_2_nhiet_do_cpu\":"
                "{\"state\":%s,\"unit\":\"\\u00b0C\","
                "\"class\":\"temperature\","
                "\"name\":\"Nhi\\u1ec7t \\u0111\\u1ed9 CPU\"},"
              "\"sensor.cam_bien_dh_ngu_2_wifi_rssi\":"
                "{\"state\":%s,\"unit\":\"dBm\","
                "\"class\":\"signal_strength\","
                "\"name\":\"S\\u00f3ng WiFi\"}"
              "}}",
              t_room,
              volt,
              xiaomi_t,
              xiaomi_h,
              xiaomi_b,
              cpu_s,
              wifi_s
            );
            return std::string(buf);
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        id(g_push_ok) = true;
                    - script.execute:
                        id: parse_ir_response
                        body: !lambda return body;
                  else:
                    - lambda: |-
                        id(g_push_ok) = false;
                    - logger.log:
                        level: WARN
                        format: "[Sensor Push] FAILED - status %d"
                        args: [response->status_code]
          on_error:
            then:
              - lambda: |-
                  id(g_push_ok) = false;

switch:
  - platform: gpio
    pin: GPIO8
    id: led_8
    inverted: true
  - platform: gpio
    pin: GPIO10
    id: led_10
    inverted: true

ota:
  platform: esphome

wifi:
  networks:
    - ssid: "3324 2.4ghz"
      password: "L@345678"
      priority: 15
    - ssid: "3324_2.4ghz"
      password: "L@345678"
      priority: 10
    - ssid: "Phuongbk_2.4Ghz"
      password: "L@345678"
      priority: 5
    - ssid: "phuongbk 2.4ghz"
      password: "L@345678"
      priority: 5
    - ssid: "mcbooks"
      password: "mcbooks123"
      priority: 0
    - ssid: "MCBOOKS"
      password: "mcbooks123"
      priority: 0
    - ssid: "mcbook"
      password: "mcbooks123"
      priority: 0
    - ssid: "MCBOOK"
      password: "mcbooks123"
      priority: 0

  # 🔋 NONE: disable power saving to keep Wi-Fi connection highly responsive and stable
  power_save_mode: NONE

  # 📶 20dB (maximum power) to ensure robust connection coverage
  output_power: 20dB

  # Kết nối nhanh, không scan lại từ đầu khi đổi IP hoặc mất điện cắm lại
  fast_connect: true

  # 🔁 Không tự reboot khi không có ai kết nối vào AP fallback
  # ESP32 cứ chạy nội bộ, chờ WiFi xuất hiện trở lại
  reboot_timeout: 0s

  # 📶 AP fallback — chỉ bật khi không tìm được WiFi sau 30s
  # Tên dễ nhận ra, không cần mật khẩu để truy cập nhanh
  # Vào 192.168.4.1 để cung cấp WiFi mới cho ESP32
  ap:
    ssid: "esp32 dieu hoa ngu 2"
    # Không có password → kết nối ngay không cần nhập gì

captive_portal:

# 🌡️ Dallas 1-Wire Temperature Sensor (DS18B20) on GPIO3
one_wire:
  - platform: gpio
    pin: GPIO3
    id: dallas_hub

sensor:
  # ── DS18B20: Nhiệt độ phòng ngủ 2 ──
  - platform: dallas_temp
    one_wire_id: dallas_hub
    name: "Nhiệt độ phòng ngủ 2"
    id: cb_temp
    update_interval: 60s
    filters:
      - delta: 0.1

  # ── Xiaomi BLE Temperature & Humidity (Miaomiaoce T2) ──
  # ── GPIO1 diagnostics: mean và std dev — cập nhật từ interval lambda ──
  # update_interval: never → chỉ publish khi interval lambda gọi publish_state()
  - platform: template
    name: "LED AC Mean"
    id: led_mean
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    name: "LED AC StdDev"
    id: led_stddev
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never

  # ── Diagnostics ──
  - platform: uptime
    name: "Uptime"
    update_interval: 300s

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 300s

  - platform: internal_temperature
    name: "Nhiệt độ CPU"
    id: cpu_temp
    update_interval: 900s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# ══════════════════════════════════════════════════════════════
# ⚙️ INTERVALS: Tách riêng scan GPIO1 và push sensor
# ══════════════════════════════════════════════════════════════
interval:

  # ── 1. Quét GPIO1 mỗi 5 giây — thuần nội bộ, KHÔNG WiFi ──
  # Quét nhanh để phát hiện đảo trạng thái sớm nhất có thể
  # Spike dòng: ~2mA × 60ms = không đáng kể, tụ 2200µF gánh hết
  - interval: 1500ms
    then:
      - lambda: |-
          // ════════════════════════════════════════════════════
          // NGUỒN 1 — GPIO1 (PRIMARY, nhanh, phản hồi tức thì)
          // ════════════════════════════════════════════════════
          // Đọc 3 sample trong 60ms — delay() = vTaskDelay() trên ESP32
          // → yield cho FreeRTOS, WiFi stack vẫn chạy bình thường
          const int N = 3;
          float s[N], sum = 0.0f, sq = 0.0f;
          for (int i = 0; i < N; i++) {
            s[i] = analogReadMilliVolts(1) / 1000.0f;
            sum += s[i];
            if (i < N - 1) delay(30);
          }
          float mean = sum / (float)N;
          for (int i = 0; i < N; i++) sq += (s[i] - mean) * (s[i] - mean);
          float std_dev = sqrtf(sq / (float)N);

          id(led_mean).publish_state(mean);
          id(led_stddev).publish_state(std_dev);

          // Active-low: LED sáng → chip kéo cathode về GND → điện áp thấp < 0.8V
          // LED tắt → chân thả nổi → pull-up cao > 1.0V ổn định
          bool gpio_on  = (mean < 0.8f);
          bool gpio_off = (mean > 1.0f);

          // Phòng ngủ 2: không có AHT20, chỉ dùng GPIO1 để xác nhận

          // ════════════════════════════════════════════════════
          // CẬP NHẬT COUNTER
          // ════════════════════════════════════════════════════
          if (gpio_on) {
            id(g_on_count)++;
            id(g_off_count) = 0;
          } else if (gpio_off) {
            id(g_off_count)++;
            id(g_on_count) = 0;
          }
          // AMBIGUOUS: không đổi counter — chờ thêm mẫu rõ hơn

          // ════════════════════════════════════════════════════
          // NGƯỠNG XÁC NHẬN — Chỉ dựa trên GPIO1
          // ════════════════════════════════════════════════════
          int on_threshold = 2;   // 10s nhấp nhô
          int off_threshold = 3;  // 15s ổn định

          // ════════════════════════════════════════════════════
          // KẾT LUẬN + PUSH (chỉ khi đảo trạng thái)
          // ════════════════════════════════════════════════════
          if (id(g_on_count) >= on_threshold && id(g_ac_state) == 0) {
            id(g_ac_state) = 1;
            id(g_on_count) = 0;
            id(push_ac_on).execute();  // 🔼 OFF → ON
          }

          if (id(g_off_count) >= off_threshold && id(g_ac_state) == 1) {
            id(g_ac_state) = 0;
            id(g_off_count) = 0;
            id(push_ac_off).execute();  // 🔽 ON → OFF
          }

  # ── 2. Poll lệnh IR pending mỗi 250 ms ──
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: return wifi::global_wifi_component->is_connected();
          then:
            - http_request.post:
                url: "http://nhasam.id.vn/aura-api/esp-push"
                capture_response: true
                max_response_buffer_size: 8192
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  char buf[256];
                  snprintf(buf, sizeof(buf), "{\"device_key\":\"cam-bien-pn2\",\"poll_only\":true,\"voltage\":%.3f}", id(led_mean).state);
                  return std::string(buf);
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - script.execute:
                              id: parse_ir_response
                              body: !lambda return body;

  # ── 3. Push nhiệt/ẩm/áp — adaptive: 5s khi có lệnh IR, 60s bình thường ──
  - interval: 5s
    then:
      - lambda: |-
          // Bỏ qua nếu sensor chưa sẵn sàng
          if (std::isnan(id(cb_temp).state)) return;

          // Bỏ qua nếu đang xử lý hoặc đang kết nối BLE để tránh nhiễu WiFi/BLE

          static uint32_t last_push = 0;
          uint32_t now = millis();
          bool need_push = false;

          if (id(g_fast_sensor_push)) {
            // Fast mode: 5s/lần trong 2 phút sau khi nhận lệnh IR
            if (now - last_push >= 4500) {
              need_push = true;
            }
            // Tự tắt sau 2 phút
            if (now - id(g_fast_push_start_time) >= 120000) {
              id(g_fast_sensor_push) = false;
            }
          } else {
            // Normal mode: 60s/lần
            if (last_push == 0 || now - last_push >= 55000) {
              need_push = true;
            }
          }

          if (need_push && wifi::global_wifi_component->is_connected()) {
            last_push = now;
            id(push_sensors_to_ha).execute();
          }

remote_transmitter:
  id: main_transmitter
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

